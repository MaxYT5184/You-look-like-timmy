<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You Look Like Timmy</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    #countdown {
      font-size: 7em;
      color: #ffffff;
      animation: flip 0.5s ease-in-out;
    }

    @keyframes flip {
      0% { transform: rotateX(90deg); opacity: 0; }
      100% { transform: rotateX(0deg); opacity: 1; }
    }

    #content {
      display: none;
      text-align: center;
      animation: reveal 1s ease-in-out forwards;
      z-index: 1;
    }

    @keyframes reveal {
      0% {
        transform: scale(0.5) translateY(50px);
        opacity: 0;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    #content img {
      width: 300px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      margin-bottom: 20px;
    }

    #content h1 {
      font-size: 3em;
      color: #ffffff;
      text-shadow: 2px 2px 10px #000;
    }

    /* Sidebar Chat */
    #chat {
      display: none;
      position: fixed;
      right: 0;
      top: 0;
      width: 300px;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      overflow-y: auto;
      padding: 20px;
      box-shadow: -5px 0 15px rgba(0,0,0,0.3);
      z-index: 2;
    }

    .message {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      animation: fadeInChat 0.6s ease-in-out forwards;
    }

    @keyframes fadeInChat {
      0% { opacity: 0; transform: translateX(50px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div id="countdown">10</div>

  <div id="content">
    <img src="https://vignette1.wikia.nocookie.net/southpark/images/4/4b/Timmy.png/revision/latest?cb=20161119231034" alt="Timmy Funny Face">
    <h1>You look like Timmy 😂</h1>
  </div>

  <div id="chat"></div>

  <script>
    let count = 10;
    const countdownEl = document.getElementById("countdown");
    const contentEl = document.getElementById("content");
    const chatEl = document.getElementById("chat");

    const interval = setInterval(() => {
      count--;
      countdownEl.style.animation = 'none';
      void countdownEl.offsetWidth;
      countdownEl.style.animation = 'flip 0.5s ease-in-out';
      countdownEl.textContent = count;
      if (count === 0) {
        clearInterval(interval);
        countdownEl.style.display = 'none';
        contentEl.style.display = 'block';
        chatEl.style.display = 'block';
        startFakeChat();
      }
    }, 1000);

    const messages = [
      "LOL 😂",
      "Nah that’s crazy!",
      "Bro really said that?",
      "Timmy moment fr",
      "💀💀💀",
      "No way... 😭",
      "This got me cryin'",
      "Certified Timmy behavior",
      "This man wild 😭",
      "I'm done 💀"
    ];

    function startFakeChat() {
      let i = 0;
      const chatInterval = setInterval(() => {
        if (i >= messages.length) {
          clearInterval(chatInterval);
          return;
        }
        const msg = document.createElement("div");
        msg.className = "message";
        msg.textContent = messages[i++];
        chatEl.appendChild(msg);
        chatEl.scrollTop = chatEl.scrollHeight;
      }, 1500);
    }
  </script>

  <!-- Particles background -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80 },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.5 },
        "size": { "value": 3 },
        "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.4, "width": 1 },
        "move": { "enable": true, "speed": 4 }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "repulse" }
        },
        "modes": {
          "repulse": { "distance": 100, "duration": 0.4 }
        }
      },
      "retina_detect": true
    });
  </script>

</body>
</html>
