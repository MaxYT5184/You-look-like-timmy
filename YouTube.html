<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Stream | Dev Max</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: #202020;
      width: 100%;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .logo img {
      height: 40px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .controls button {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    .main {
      display: flex;
      width: 100%;
      height: calc(100vh - 60px);
    }

    .video-area {
      flex: 3;
      background: #000;
      position: relative;
    }

    .video-feed {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-feed img {
      max-width: 60%;
    }

    .chat-area {
      flex: 1;
      background: #181818;
      overflow: auto;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .chat-message {
      margin-bottom: 5px;
      font-size: 14px;
    }

    .fake-users {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .screen-capture {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #444;
      color: #fff;
      padding: 5px;
      font-size: 12px;
    }

    .channel-img {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .channel-img img {
      height: 50px;
    }

    .stats {
      position: absolute;
      top: 40px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Kick.com_Logo.svg" alt="Kick" style="height:30px">
    </div>
    <div class="controls">
      <button onclick="toggleMic()">🎤 Mic</button>
      <button onclick="toggleCam()">📷 Camera</button>
    </div>
  </header>

  <div class="main">
    <div class="video-area">
      <div class="channel-img">
        <img src="camera.png" alt="Channel PNG">
      </div>
      <div class="fake-users">🧍 150 viewers</div>
      <div class="video-feed" id="videoFeed">
        <p>Camera is off</p>
      </div>
      <div class="screen-capture">🖥️ Screen Capturing...</div>
      <div class="stats" id="stats">
        <p>Views: <span id="views">0</span></p>
        <p>Likes: <span id="likes">0</span></p>
        <p>Subs: <span id="subs">0</span></p>
      </div>
    </div>
    <div class="chat-area" id="chatArea">
      <!-- Chat messages will appear here -->
    </div>
  </div>

      "Stop trolling!", "Wait what?", "How did that happen?", "This content is W",

      "WHERE IS THE STREAMER", "Looks like replay", "Deja vu stream?",

      "2 AM gang!", "I’m in the future", "It’s buffering", "404 mic not found",

      "Stop PNG trolling!", "Who made this?!", "He’s back again?!",
      "Fake delay 😂", "Still live?", "Backrooms stream?", "Random AF lol",
      "PNG takeover!", "Shhh quiet!", "Add sound effects!", "This better than Netflix", "True entertainment 😂",

      "Legend!", "Mic W", "Obsessed with PNG", "Mic echoing", "Best stream today",

      "He using green screen?", "Where's the rage cam?", "Streamer vanished!",
      "RIP chat", "10/10 PNG usage", "Meme stream 😂"
    ];

    let views = 0;
    let likes = 0;
    let subs = 0;

    // Update view count, likes, and subs slowly
    function updateStats() {
      views += Math.floor(Math.random() * 5) + 1;
      likes += Math.floor(Math.random() * 3) + 1;
      subs += Math.floor(Math.random() * 2) + 1;

      document.getElementById("views").textContent = views.toLocaleString();
      document.getElementById("likes").textContent = likes.toLocaleString();
      document.getElementById("subs").textContent = subs.toLocaleString();
    }

    setInterval(updateStats, 2000); // Update every 2 seconds (can adjust speed)

    function addFakeMessage() {
      const msg = document.createElement("div");
      msg.classList.add("chat-message");
      const username = `user${Math.floor(Math.random() * 10000)}`;
      const content = messages[Math.floor(Math.random() * messages.length)];
      msg.textContent = `${username}: ${content}`;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    setInterval(addFakeMessage, 250); // Adjust speed here (lower = faster)

    let micOn = true;
    let camOn = false;

    function toggleMic() {
      micOn = !micOn;
      alert(`Mic is now ${micOn ? "ON" : "OFF"}`);
    }

    function toggleCam() {
      camOn = !camOn;
      document.getElementById("videoFeed").innerHTML = camOn ? "<p>Camera is ON</p>" : "<p>Camera is OFF</p>";
    }

  </script>
</body>
</html>
