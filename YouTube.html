<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake YouTube Stream</title>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #181818;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: #202020;
      width: 100%;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 9999;
    }

    .logo {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .logo img {
      height: 40px;
    }

    .controls {
      display: flex;
      gap: 15px;
    }

    .controls button {
      background: #333;
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 14px;
    }

    .controls button:hover {
      background: #444;
    }

    .main {
      display: flex;
      width: 100%;
      height: calc(100vh - 60px);
    }

    .video-area {
      flex: 3;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-feed {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-feed img {
      max-width: 100%;
    }

    .chat-area {
      flex: 1;
      background: #181818;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .chat-message {
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .chat-message span {
      font-weight: bold;
      color: #ff0000;
    }

    .chat-message p {
      margin: 0;
    }

    .fake-users {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 14px;
      color: #fff;
    }

    .screen-capture {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .channel-img {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .channel-img img {
      height: 50px;
    }

    .stats {
      position: absolute;
      top: 40px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
    }

    .controls {
      margin-right: 20px;
    }

    .controls button {
      background: #ff0000;
    }

    .controls button:hover {
      background: #e60000;
    }

    .chat-area::-webkit-scrollbar {
      width: 6px;
    }

    .chat-area::-webkit-scrollbar-thumb {
      background-color: #444;
      border-radius: 10px;
    }

    .video-feed p {
      color: #fff;
      font-size: 18px;
    }

    /* YouTube-like styles */
    .chat-message {
      background: #212121;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 5px;
    }

    .chat-message span {
      font-weight: bold;
      color: #ff0000;
      font-size: 16px;
    }

    .chat-message p {
      font-size: 14px;
      margin-top: 5px;
      color: #ddd;
    }

  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
    </div>
    <div class="controls">
      <button onclick="toggleMic()">🎤 Mic</button>
      <button onclick="toggleCam()">📷 Camera</button>
    </div>
  </header>

  <div class="main">
    <div class="video-area">
      <div class="channel-img">
        <img src="camera.png" alt="Channel PNG">
      </div>
      <div class="fake-users">👀 1,324,234 viewers</div>
      <div class="video-feed" id="videoFeed">
        <p>Camera is off</p>
      </div>
      <div class="screen-capture">🖥️ Screen Capturing...</div>
      <div class="stats" id="stats">
        <p>Views: <span id="views">0</span></p>
        <p>Likes: <span id="likes">0</span></p>
        <p>Subs: <span id="subs">0</span></p>
      </div>
    </div>
    <div class="chat-area" id="chatArea">
      <!-- Chat messages will appear here -->
    </div>
  </div>

  <script>
    const chatArea = document.getElementById("chatArea");
    const messages = [
      "Let's go!", "W stream!", "Kick better?", "Sub pls!", "First!", "OMG this is fire!",
      "Where’s the mic?", "Mic muted?", "Turn cam on!", "Haha nice!", "This is wild!",
      "Insane view count!", "GG!", "This game is 🔥", "Replay that!", "Camera PNG lol",
      "Fake stream?", "Real or fake?", "WHERE IS THE GAME", "He’s cooking!", "Someone donate!", 
      "100 likes now!", "Cam onnn", "Sheesh!!", "Mic W", "W PNG use", "Legend!", "This better than Netflix",
      "True entertainment 😂", "Ultimate PNG stream", "Chat is elite", "Why so funny?", "Bro really just did that"
    ];

    const fakeUsernames = [
      "Miners833", "MaxYT7767", "Gamer1234", "Player4567", "ProPlayer34", "StreamingKing99",
      "NoobMasterX", "MightyTurtle21", "SpeedyGamer11", "SuperNova88", "GameLord909", "ChillBeatz11",
      "GamingDudeX", "EpicGamer47", "LiveForGaming", "RealFastPlayer", "CleverGamer25", "EpicVision11",
      "MaximusPower44", "SpeedyTitan20"
    ];

    let views = 0;
    let likes = 0;
    let subs = 0;

    // Update view count, likes, and subs slowly
    function updateStats() {
      views += Math.floor(Math.random() * 10) + 500; // Random increment up to 10
      likes += Math.floor(Math.random() * 5) + 1;
      subs += Math.floor(Math.random() * 2) + 1;

      // Limit the views to 1,324,234
      if (views > 1324234) views = 1324234;

      document.getElementById("views").textContent = views.toLocaleString();
      document.getElementById("likes").textContent = likes.toLocaleString();
      document.getElementById("subs").textContent = subs.toLocaleString();
    }

    setInterval(updateStats, 1000); // Update every second

    function addFakeMessage() {
      const msg = document.createElement("div");
      msg.classList.add("chat-message");
      const username = fakeUsernames[Math.floor(Math.random() * fakeUsernames.length)];  // Select random username
      msg.innerHTML = `<span>${username}:</span> ${messages[Math.floor(Math.random() * messages.length)]}`;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    setInterval(addFakeMessage, 3000); // Add fake messages every 3 seconds

    let micOn = false;
    let camOn = false;

    function toggleMic() {
      micOn = !micOn;
      alert(micOn ? "Mic ON" : "Mic OFF");
    }

    function toggleCam() {
      camOn = !camOn;
      document.getElementById("videoFeed").innerHTML = camOn ? "<p>Camera is ON</p>" : "<p>Camera is OFF</p>";
    }
  </script>
</body>
</html>
